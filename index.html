<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="favicon.ico" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Plantilla" />
<meta name="theme-color" content="#0d9488" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Plantilla - Pagos</title>
<script src="lib/lucide.min.js"></script>
<style>
:root{--bg:#f2f7f6;--card:#fff;--ink:#12201e;--mut:#7a8c89;--line:#e3eeec;--pri:#0d9488;--soft:#d9f3ef;--ok:#16a34a;--okbg:#dcfce7;--warn:#ea580c;--warnbg:#ffedd5;--sh:0 2px 12px rgba(13,148,136,.08)}
.dark{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--line:#334155;--soft:#134e4a;--okbg:#064e3b;--warnbg:#7c2d12;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.hidden{display:none!important}.wrap{max-width:30rem;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 8px}
.top .wrap{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.ib{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;margin-left:8px;color:var(--mut)}.ib svg{width:19px;height:19px}
.hero{border-radius:24px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#0d9488,#14b8a6 65%,#5eead4);box-shadow:0 10px 28px rgba(13,148,136,.3);display:flex;gap:16px;margin-bottom:12px}
.hero div{flex:1}.hero small{display:block;opacity:.85;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.hero b{font-size:1.8rem;font-weight:800}.hero .sep{flex:0 0 1px;background:rgba(255,255,255,.3)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px}
.e{display:flex;gap:10px;align-items:center;margin-bottom:8px}.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.big{font-weight:800;font-size:1.05rem}.mut{color:var(--mut);font-size:.78rem}.amt{font-weight:800;font-size:1.15rem;color:var(--pri)}
.pill{display:inline-block;font-size:.65rem;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:99px;text-transform:uppercase}
.pill.p{background:var(--warnbg);color:var(--warn)}.pill.c{background:var(--okbg);color:var(--ok)}
.sm{padding:9px;border-radius:12px;color:var(--mut)}.sm svg{width:17px;height:17px}.sm.pay{background:var(--soft);color:var(--pri)}.sm.del{color:#f87171}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
.tabbar .wrap{display:flex;padding:0}.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-size:.68rem;font-weight:700;color:var(--mut)}.tab svg{width:22px;height:22px}.tab.on{color:var(--pri)}
.hd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}.hd h2{margin:0;font-size:1.05rem;text-transform:capitalize;text-align:center}
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,20,18,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:30rem;border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font-size:1.15rem}.sheet .sub{color:var(--mut);font-size:.8rem;margin-bottom:12px;text-transform:capitalize}
input{font-size:16px;width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;outline:0;min-width:0}input:focus{border-color:var(--pri)}
.hrs{width:92px;text-align:center;font-weight:800;flex:none}
.cr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.cr .d{width:62px;font-size:.85rem;font-weight:700;text-transform:capitalize;flex:none}
.two{display:flex;gap:10px}.two>*{flex:1}
.btn{width:100%;padding:14px;border-radius:16px;background:var(--pri);color:#fff;font-weight:800}.btn.b{background:#2563eb}.btn.g{background:#16a34a}.btn.s{background:var(--soft);color:var(--pri)}.btn.gr{background:var(--bg);color:var(--mut)}
.link{color:var(--mut);font-size:.8rem;font-weight:700;padding:10px;width:100%}
label.l{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 4px 6px}
.sum{background:var(--bg);border-radius:16px;padding:12px 14px;margin:12px 0}.sum .row{margin:3px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}.tot{position:sticky;bottom:0}
</style>
</head>
<body>
<div class="top"><div class="wrap"><h1>Plantilla</h1><div>
<button class="ib" onclick="openEmps()" aria-label="Empleados"><i data-lucide="users"></i></button>
<button class="ib" onclick="toggleDark()"><i id="ti" data-lucide="moon"></i></button></div></div></div>
<main class="wrap">
<section id="v-day">
 <div class="hd"><button class="ib" onclick="moveDay(-1)"><i data-lucide="chevron-left"></i></button><h2 id="dayLabel"></h2><button class="ib" onclick="moveDay(1)"><i data-lucide="chevron-right"></i></button></div>
 <button class="link" style="margin-top:-8px" onclick="dayDate=today();renderDay()">Ir a hoy</button>
 <div id="dayList"></div><div class="card row sp" id="dayTot"></div>
</section>
<section id="v-week" class="hidden">
 <div class="hd"><button class="ib" onclick="moveWeek(-1)"><i data-lucide="chevron-left"></i></button><h2 id="weekLabel"></h2><button class="ib" onclick="moveWeek(1)"><i data-lucide="chevron-right"></i></button></div>
 <div class="hero"><div><small>Por pagar</small><b id="w-pend">0€</b></div><span class="sep"></span><div><small>Pagado</small><b id="w-paid">0€</b></div></div>
 <div id="weekList"></div>
</section>
<section id="v-hist" class="hidden"><div class="hd"><h2>Semanas anteriores</h2></div><div id="histList"></div></section>
</main>
<nav class="tabbar"><div class="wrap">
<button class="tab on" id="t-day" onclick="go('day')"><i data-lucide="calendar-check"></i>Día</button>
<button class="tab" id="t-week" onclick="go('week')"><i data-lucide="wallet"></i>Pagos</button>
<button class="tab" id="t-hist" onclick="go('hist')"><i data-lucide="history"></i>Historial</button></div></nav>

<div id="ew" class="ov hidden" onclick="if(event.target===this)closeEW()"><div class="sheet">
 <h3 id="ew-title"></h3><div class="sub" id="ew-sub"></div><div id="ew-days"></div>
 <label class="l">Anticipos</label><div id="ew-adv"></div>
 <div class="cr"><input id="advAmt" type="number" inputmode="decimal" placeholder="€" style="width:90px;flex:none"><input id="advNote" placeholder="Nota (opcional)"></div>
 <button class="btn s" onclick="addAdv()">Añadir anticipo</button>
 <div class="sum" id="ew-sum"></div><div id="ew-pay"></div><button class="link" onclick="closeEW()">Cerrar</button>
</div></div>

<div id="emps" class="ov hidden" onclick="if(event.target===this)closeEmps()"><div class="sheet">
 <h3>Empleados y ajustes</h3>
 <label class="l">Precio por hora (para registros nuevos)</label><input id="rateInput" type="number" inputmode="decimal" onchange="setRate(this.value)">
 <label class="l">Empleados</label><div id="empList"></div>
 <div class="cr"><input id="newEmp" placeholder="Nombre del empleado"><button class="btn s" style="width:auto;padding:12px 16px" onclick="addEmp()">Añadir</button></div>
 <label class="l">Copia de seguridad</label>
 <div class="two"><button class="btn b" id="export-btn">Exportar</button><button class="btn g" id="import-btn">Cargar</button></div>
 <input type="file" id="import-input" accept=".json" style="display:none" />
 <button class="link" onclick="closeEmps()">Cerrar</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>new Date(s+"T12:00");
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const weekStart=s=>addDays(s,-parse(s).getDay());      // semana: domingo -> sábado
const money=n=>(Math.round(n*100)/100).toString().replace(".",",")+"€";
const fmtLong=s=>parse(s).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=s=>parse(s).toLocaleDateString("es-ES",{day:"numeric",month:"short"});
const weekLabel=ws=>`${fmtShort(ws)} – ${fmtShort(addDays(ws,6))}`;
const dayName=s=>parse(s).toLocaleDateString("es-ES",{weekday:"short",day:"numeric"});
function load(){try{const v=JSON.parse(localStorage.getItem("plantilla_v1"));if(v&&Array.isArray(v.employees))return{employees:v.employees,entries:v.entries||[],advances:v.advances||[],payments:v.payments||{},settings:v.settings||{rate:10}}}catch{}return{employees:[],entries:[],advances:[],payments:{},settings:{rate:10}}}
let D=load();const save=()=>localStorage.setItem("plantilla_v1",JSON.stringify(D));
let tab="day",dayDate=today(),wk=weekStart(today()),openEmp=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const emp=id=>D.employees.find(e=>e.id===id);
const getEntry=(id,d)=>D.entries.find(e=>e.empId===id&&e.date===d);
const payKey=(ws,id)=>ws+"|"+id;

// Cálculo de una semana para un empleado
function calc(ws,id){const we=addDays(ws,6),inW=x=>x.date>=ws&&x.date<=we;
 const es=D.entries.filter(e=>e.empId===id&&inW(e)),ad=D.advances.filter(a=>a.empId===id&&inW(a));
 const hours=es.reduce((s,e)=>s+e.hours,0),gross=es.reduce((s,e)=>s+e.hours*e.rate,0),adv=ad.reduce((s,a)=>s+a.amount,0);
 return{hours,gross,adv,net:gross-adv,es,ad,pay:D.payments[payKey(ws,id)]||null}}
const weekEmps=ws=>{const we=addDays(ws,6);return D.employees.filter(e=>e.active!==false||D.entries.some(x=>x.empId===e.id&&x.date>=ws&&x.date<=we)||D.advances.some(x=>x.empId===e.id&&x.date>=ws&&x.date<=we))};

function setHours(id,date,v){const h=parseFloat(String(v).replace(",","."));let i=D.entries.findIndex(e=>e.empId===id&&e.date===date);
 if(!(h>0)){if(i>=0)D.entries.splice(i,1)}else if(i>=0)D.entries[i].hours=h;else D.entries.push({id:uid(),empId:id,date,hours:h,rate:D.settings.rate});
 save();dayTotal();if(openEmp)renderEW();renderWeek();renderHist()}

// Día
function renderDay(){$("dayLabel").textContent=fmtLong(dayDate);const act=D.employees.filter(e=>e.active!==false);
 $("dayList").innerHTML=act.map(e=>{const en=getEntry(e.id,dayDate);return `<div class="card e"><div class="grow big">${esc(e.name)}</div><input class="hrs" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0" value="${en?en.hours:""}" onchange="setHours('${e.id}','${dayDate}',this.value)"><span class="mut">h</span></div>`}).join("")||`<div class="empty">Añade a tus empleados con el icono de arriba para empezar.</div>`;
 $("dayTot").classList.toggle("hidden",!act.length);dayTotal()}
function dayTotal(){const es=D.entries.filter(e=>e.date===dayDate);$("dayTot").innerHTML=`<span class="mut">Total del día</span><b>${es.reduce((s,e)=>s+e.hours,0)}h · ${money(es.reduce((s,e)=>s+e.hours*e.rate,0))}</b>`}
function moveDay(n){dayDate=addDays(dayDate,n);renderDay()}

// Pagos de la semana
function status(c){if(!c.pay)return `<span class="pill p">Pendiente</span>`;const ch=Math.abs(c.pay.amount-c.net)>0.005;return `<span class="pill c">Pagado ${c.pay.method==="cash"?"💵":"🏦"}</span>`+(ch?` <span class="pill p">Cambió</span>`:"")}
function renderWeek(){$("weekLabel").textContent=weekLabel(wk);let pend=0,paid=0;
 const list=weekEmps(wk).map(e=>({e,c:calc(wk,e.id)})).filter(x=>x.c.hours>0||x.c.adv>0||x.c.pay);
 list.forEach(({c})=>{if(c.pay)paid+=c.pay.amount;else if(c.net>0)pend+=c.net});
 $("w-pend").textContent=money(pend);$("w-paid").textContent=money(paid);
 $("weekList").innerHTML=list.map(({e,c})=>`<div class="card e" onclick="openEW('${e.id}')"><div class="grow"><div class="big">${esc(e.name)}</div><div class="mut">${c.hours}h${c.adv?` · anticipo −${money(c.adv)}`:""}</div><div style="margin-top:4px">${status(c)}</div></div><div class="amt" style="${c.net<0?"color:var(--warn)":""}">${money(c.net)}</div></div>`).join("")||`<div class="empty">No hay horas esta semana.</div>`}
function moveWeek(n){wk=addDays(wk,7*n);renderWeek()}

// Detalle empleado-semana
function openEW(id){openEmp=id;renderEW();$("ew").classList.remove("hidden");lucide.createIcons()}
function closeEW(){openEmp=null;$("ew").classList.add("hidden");renderWeek();renderHist();if(tab==="day")renderDay()}
function renderEW(){const e=emp(openEmp),c=calc(wk,openEmp);$("ew-title").textContent=e.name;$("ew-sub").textContent="Semana "+weekLabel(wk);
 $("ew-days").innerHTML=Array.from({length:7},(_,i)=>addDays(wk,i)).map(d=>{const en=getEntry(openEmp,d);return `<div class="cr"><span class="d">${dayName(d)}</span><input class="hrs" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0" value="${en?en.hours:""}" onchange="setHours('${openEmp}','${d}',this.value)"><span class="mut grow">${en?`${en.rate}€/h = ${money(en.hours*en.rate)}`:""}</span></div>`}).join("");
 $("ew-adv").innerHTML=c.ad.map(a=>`<div class="cr"><span class="grow">−${money(a.amount)} <span class="mut">${esc(a.note||"")} · ${fmtShort(a.date)}</span></span><button class="sm del" onclick="delAdv('${a.id}')"><i data-lucide="trash-2"></i></button></div>`).join("")||`<div class="mut" style="margin-bottom:8px">Sin anticipos esta semana.</div>`;
 $("ew-sum").innerHTML=`<div class="row sp"><span>Horas</span><b>${c.hours}h</b></div><div class="row sp"><span>Total bruto</span><b>${money(c.gross)}</b></div><div class="row sp"><span>Anticipos</span><b>−${money(c.adv)}</b></div><div class="row sp" style="font-size:1.15rem"><b>A pagar</b><b class="amt" style="${c.net<0?"color:var(--warn)":""}">${money(c.net)}</b></div>`+(c.net<0?`<div class="mut">Los anticipos superan lo trabajado.</div>`:"");
 $("ew-pay").innerHTML=c.pay?`<div class="sum" style="background:var(--okbg)">Pagado ${money(c.pay.amount)} ${c.pay.method==="cash"?"en efectivo 💵":"por banco 🏦"}${Math.abs(c.pay.amount-c.net)>0.005?`<br><b style="color:var(--warn)">Ojo: ahora debería ser ${money(c.net)}</b>`:""}</div><button class="btn gr" onclick="unpay()">Deshacer pago</button>`
  :c.net>0?`<div class="two"><button class="btn b" onclick="pay('transfer')">Banco 🏦</button><button class="btn g" onclick="pay('cash')">Efectivo 💵</button></div>`:"";
 lucide.createIcons()}
function pay(m){const c=calc(wk,openEmp);D.payments[payKey(wk,openEmp)]={method:m,amount:c.net,date:today()};save();renderEW()}
function unpay(){delete D.payments[payKey(wk,openEmp)];save();renderEW()}
function addAdv(){const a=parseFloat($("advAmt").value.replace(",","."));if(!(a>0))return alert("Indica el importe del anticipo");
 const t=today(),d=(t>=wk&&t<=addDays(wk,6))?t:addDays(wk,6);D.advances.push({id:uid(),empId:openEmp,date:d,amount:a,note:$("advNote").value.trim()});
 $("advAmt").value="";$("advNote").value="";save();renderEW()}
function delAdv(id){D.advances=D.advances.filter(a=>a.id!==id);save();renderEW()}

// Historial
function renderHist(){const set=new Set([...D.entries,...D.advances].map(x=>weekStart(x.date)));const weeks=[...set].sort().reverse();
 $("histList").innerHTML=weeks.map(ws=>{let net=0,n=0,p=0;D.employees.forEach(e=>{const c=calc(ws,e.id);if(c.hours>0||c.adv>0){n++;net+=c.pay?c.pay.amount:c.net;if(c.pay)p++}});
  return `<div class="card e" onclick="wk='${ws}';go('week')"><div class="grow"><div class="big">${weekLabel(ws)}</div><div class="mut">${n} empleados</div></div><div style="text-align:right"><div class="amt">${money(net)}</div><span class="pill ${p===n?"c":"p"}">${p}/${n} pagados</span></div></div>`}).join("")||`<div class="empty">Aquí irán apareciendo las semanas.</div>`}

function go(t){tab=t;["day","week","hist"].forEach(x=>{$("v-"+x).classList.toggle("hidden",x!==t);$("t-"+x).classList.toggle("on",x===t)});
 if(t==="day")renderDay();if(t==="week")renderWeek();if(t==="hist")renderHist();lucide.createIcons();window.scrollTo(0,0)}

// Empleados y ajustes
function openEmps(){$("rateInput").value=D.settings.rate;renderEmps();$("emps").classList.remove("hidden")}
function closeEmps(){$("emps").classList.add("hidden");go(tab)}
function renderEmps(){$("empList").innerHTML=D.employees.map((e,i)=>`<div class="cr"><input value="${esc(e.name)}" style="${e.active===false?"opacity:.5":""}" onchange="renameEmp(${i},this.value)"><button class="sm" title="${e.active===false?"Reactivar":"Archivar"}" onclick="toggleEmp(${i})"><i data-lucide="${e.active===false?"rotate-ccw":"archive"}"></i></button><button class="sm del" onclick="delEmp(${i})"><i data-lucide="trash-2"></i></button></div>`).join("")||`<div class="mut" style="margin-bottom:8px">Aún no hay empleados.</div>`;lucide.createIcons()}
function addEmp(){const n=$("newEmp").value.trim();if(!n)return;D.employees.push({id:uid(),name:n,active:true});$("newEmp").value="";save();renderEmps()}
function renameEmp(i,v){v=v.trim();if(v)D.employees[i].name=v;save();renderEmps()}
function toggleEmp(i){D.employees[i].active=D.employees[i].active===false;save();renderEmps()}
function delEmp(i){const e=D.employees[i],has=D.entries.some(x=>x.empId===e.id)||D.advances.some(x=>x.empId===e.id);
 if(has){if(confirm(`${e.name} tiene registros, así que no se borra: se archiva y se conserva su historial. ¿Archivar?`)){e.active=false;save();renderEmps()}}
 else if(confirm(`¿Eliminar a ${e.name}?`)){D.employees.splice(i,1);save();renderEmps()}}
function setRate(v){const r=parseFloat(String(v).replace(",","."));if(r>0){D.settings.rate=r;save()}else $("rateInput").value=D.settings.rate}

// Exportar / importar
$("export-btn").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=`plantilla-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$("import-btn").addEventListener("click",()=>$("import-input").click());
function validar(v){const re=/^\d{4}-\d{2}-\d{2}$/;if(!v||!Array.isArray(v.employees)||!Array.isArray(v.entries)||!Array.isArray(v.advances))return null;
 if(!v.employees.every(e=>e&&e.id&&typeof e.name==="string"))return null;if(!v.entries.every(e=>e&&e.empId&&re.test(e.date)&&e.hours>0&&e.rate>=0))return null;if(!v.advances.every(a=>a&&a.empId&&re.test(a.date)&&a.amount>0))return null;
 return{employees:v.employees,entries:v.entries,advances:v.advances,payments:v.payments||{},settings:{rate:(v.settings&&v.settings.rate)||10}}}
$("import-input").addEventListener("change",ev=>{const inp=ev.target,f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=x=>{try{const v=validar(JSON.parse(x.target.result));if(!v)return alert("Archivo inválido ❌ No se ha cambiado nada.");
  if(!confirm(`Se reemplazarán todos los datos actuales por los del archivo (${v.employees.length} empleados, ${v.entries.length} registros). ¿Continuar?`))return;
  D=v;save();$("rateInput").value=D.settings.rate;renderEmps();go(tab);alert("Datos importados ✅")}catch{alert("Error al leer el archivo ❌")}finally{inp.value=""}};r.readAsText(f)});

// Tema, sin zoom y arranque
function themeIcon(){$("ti").parentElement.innerHTML=`<i id="ti" data-lucide="${document.documentElement.classList.contains("dark")?"sun":"moon"}"></i>`;lucide.createIcons()}
function toggleDark(){const d=document.documentElement.classList.toggle("dark");localStorage.setItem("theme",d?"dark":"light");themeIcon()}
{const t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
themeIcon();go("day");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
